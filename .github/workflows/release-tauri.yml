name: Publish Tauri shell + updater manifest

# Fires on the same `v*` tag the GHCR docker workflow uses, so one tag
# push produces (1) a GHCR docker image and (2) signed Tauri bundles
# for win/mac/linux + a `latest.json` updater manifest on GitHub
# Releases. Running shells call `updater.check()` on launch, fetch
# latest.json, verify the signature with the pubkey embedded in the
# binary, prompt the user, install on confirm.
#
# Required repo secret:
#   TAURI_SIGNING_PRIVATE_KEY - contents of prism-tauri-signing.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - empty if key was generated without
#                                        a password; required if it was set
#
# OS code signing (Apple Developer ID, Windows EV cert) is NOT wired
# yet — first install shows SmartScreen warning. Updates still flow
# once installed because Tauri verifies its own minisign signature.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'   # arm64
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'   # x64
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS matrix entries need the cross target installed.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build SPA (prism_service/web → web_dist)
        run: |
          cd services/prism-service/prism_service/web
          npm install --no-audit --no-fund
          npm run build

      - name: Install Tauri shell deps
        run: |
          cd services/prism-service/desktop/tauri-shell
          npm install --no-audit --no-fund

      - name: Sync Tauri shell version to PRISM_VERSION
        shell: bash
        run: |
          # tauri.conf.json's version is what the updater compares to
          # decide whether a newer release is available. Without this
          # sync the shipped .msi/.dmg/.AppImage internally reports
          # whatever was committed (0.1.0 from the scaffold) and the
          # updater never advances. Pull the canonical version from
          # the Python __version__ and rewrite the JSON in place.
          python - <<'PY'
          import json, re, pathlib
          version_py = pathlib.Path("services/prism-service/prism_service/__version__.py").read_text()
          m = re.search(r'PRISM_VERSION\s*=\s*"([^"]+)"', version_py)
          if not m:
              raise SystemExit("PRISM_VERSION not found in __version__.py")
          v = m.group(1)
          conf = pathlib.Path("services/prism-service/desktop/tauri-shell/src-tauri/tauri.conf.json")
          d = json.loads(conf.read_text())
          d["version"] = v
          conf.write_text(json.dumps(d, indent=2))
          print(f"tauri.conf.json version -> {v}")
          PY

      - name: Build + sign Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: services/prism-service/desktop/tauri-shell
          tagName: ${{ github.ref_name }}
          releaseName: 'PRISM ${{ github.ref_name }}'
          releaseBody: |
            Native Tauri shell bundles for ${{ github.ref_name }}.
            Auto-update: existing installs will fetch + verify via
            the embedded minisign pubkey.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
