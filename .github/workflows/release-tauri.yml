name: Publish Tauri shell + updater manifest

# Fires on the same `v*` tag the GHCR docker workflow uses, so one tag
# push produces (1) a GHCR docker image and (2) signed Tauri bundles
# for win/mac/linux + a `latest.json` updater manifest on GitHub
# Releases. Running shells call `updater.check()` on launch, fetch
# latest.json, verify the signature with the pubkey embedded in the
# binary, prompt the user, install on confirm.
#
# Required repo secret:
#   TAURI_SIGNING_PRIVATE_KEY - contents of prism-tauri-signing.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - empty if key was generated without
#                                        a password; required if it was set
#
# OS code signing (Apple Developer ID, Windows EV cert) is NOT wired
# yet — first install shows SmartScreen warning. Updates still flow
# once installed because Tauri verifies its own minisign signature.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'   # arm64
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'   # x64
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS matrix entries need the cross target installed.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build SPA (prism_service/web → web_dist)
        run: |
          cd services/prism-service/prism_service/web
          npm install --no-audit --no-fund
          npm run build

      # --- Bundle prism-service as a Tauri sidecar (v6.1.0+, issue #84) ----
      # The Tauri installer used to ship just the shell; users had to
      # pipx-install the backend by hand or hit ERR_CONNECTION_REFUSED.
      # PyInstaller freezes prism_service into a single platform-native
      # exe that ships alongside prism-shell.exe via bundle.externalBin.
      # --------------------------------------------------------------------
      - name: Setup Python (for sidecar build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prism-service + pyinstaller into a sidecar venv
        shell: bash
        run: |
          cd services/prism-service
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e .

      - name: Resolve Rust target triple for sidecar naming
        id: triple
        shell: bash
        run: |
          # tauri-action passes --target X via matrix.args on macOS; on
          # linux/windows the matrix uses the host's default triple.
          ARGS="${{ matrix.args }}"
          if echo "$ARGS" | grep -q -- '--target'; then
            TRIPLE=$(echo "$ARGS" | sed -E 's/.*--target +([^ ]+).*/\1/')
          else
            TRIPLE=$(rustc -vV | sed -n 's|host: ||p')
          fi
          echo "triple=$TRIPLE" >> "$GITHUB_OUTPUT"
          echo "Sidecar target triple: $TRIPLE"

      - name: Build prism-service sidecar (pyinstaller)
        shell: bash
        run: |
          cd services/prism-service
          pyinstaller installer/pyinstaller.spec --noconfirm --clean
          ls -la dist/

      - name: Stage sidecar into Tauri externalBin slot
        shell: bash
        run: |
          cd services/prism-service
          mkdir -p desktop/tauri-shell/src-tauri/binaries
          TRIPLE="${{ steps.triple.outputs.triple }}"
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            cp dist/prism-service.exe "desktop/tauri-shell/src-tauri/binaries/prism-service-${TRIPLE}.exe"
          else
            cp dist/prism-service "desktop/tauri-shell/src-tauri/binaries/prism-service-${TRIPLE}"
            chmod +x "desktop/tauri-shell/src-tauri/binaries/prism-service-${TRIPLE}"
          fi
          ls -la desktop/tauri-shell/src-tauri/binaries/

      - name: Install Tauri shell deps
        run: |
          cd services/prism-service/desktop/tauri-shell
          npm install --no-audit --no-fund

      # Keep the native bundle + latest.json version in lockstep with
      # PRISM_VERSION. Without this the shell version was frozen at 0.1.0,
      # so every release's latest.json reported 0.1.0 and installed native
      # clients (also 0.1.0) never saw a newer version -> no auto-update.
      - name: Sync Tauri version to PRISM_VERSION
        shell: bash
        run: |
          cd services/prism-service
          V=$(python -c "import re,pathlib; print(re.search(r'PRISM_VERSION\s*=\s*\"([^\"]+)\"', pathlib.Path('prism_service/__version__.py').read_text()).group(1))")
          python -c "import json,pathlib; p=pathlib.Path('desktop/tauri-shell/src-tauri/tauri.conf.json'); d=json.loads(p.read_text()); d['version']='$V'; p.write_text(json.dumps(d, indent=2) + '\n')"
          echo "tauri.conf.json version -> $V"; grep '\"version\"' desktop/tauri-shell/src-tauri/tauri.conf.json

      - name: Build + sign Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action's release-upload path uses the Octokit client,
          # which reads GITHUB_TOKEN from env directly — the job-level
          # `permissions: contents: write` grants the right scope but
          # the action doesn't auto-pick up GITHUB_TOKEN unless it's
          # in the step env. Every v6.x tag built clean bundles, then
          # died with "GITHUB_TOKEN is required" on the upload step.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: services/prism-service/desktop/tauri-shell
          tagName: ${{ github.ref_name }}
          releaseName: 'PRISM ${{ github.ref_name }}'
          releaseBody: |
            Native Tauri shell bundles for ${{ github.ref_name }}.
            Auto-update: existing installs will fetch + verify via
            the embedded minisign pubkey.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
