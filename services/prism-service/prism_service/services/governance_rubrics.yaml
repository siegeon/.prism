# Architecture-governance gate rubrics (task 8579d49e, piece b1).
#
# RUBRICS ARE DATA, NOT CODE. arc_governance.score_story_complete /
# score_plan_coverage are pure functions of (evidence, rubric[,
# principles]); the conductor's story/plan gates consult them via
# _VERIFIER_RULES — no override=True required on a compliant drive.
# Ported from arc-kit (MIT) governance rubrics, reshaped for PRISM.

story_complete:
  # Every required section must appear as a markdown heading (substring
  # match, case-insensitive) in the story document (task.plan_doc).
  required_sections:
    - Summary
    - Requirements
    - Acceptance Criteria
  # The heading whose bullets carry the acceptance criteria.
  ac_section: Acceptance Criteria
  # Every AC bullet must carry an AC-<n> id...
  ac_id_pattern: 'AC-\d+'
  # ...and an observable oracle ("— oracle: <check>") on the same bullet.
  require_oracle: true
  oracle_marker: 'oracle:'

plan_coverage:
  # (e2) the plan must ship a parsing mermaid plan_diagram.
  require_plan_diagram: true
  # (b3-i) every story AC id must be referenced by the plan_doc.
  ac_id_pattern: 'AC-\d+'
  # (b3-ii / c1) plan_diagram edges are diffed against Brain-stored
  # principles BEFORE code; zero seeded principles never pass.
  require_principles: true

premise_grounded:
  # (task 3a63190b / github issue #222) review_previous_notes: the ticket's
  # load-bearing claims must be checked, not just the story's FORM. Every
  # claim bullet under claims_section carries EITHER a citation (file:line,
  # a run/PR/commit/issue id, or backtick command output) OR an explicit
  # REFUTED/UNVERIFIED marker — never neither. Checked at the
  # review_previous_notes step itself (ConductorService.advance_task), not
  # a downstream gate — draft_story's story_complete already shadows any
  # validation placed on review_previous_notes through gate inheritance.
  claims_section: Premises

green_outcome:
  # (task 3eb67fb3) the terminal green_gate ORACLE tooth. A green close must
  # EVIDENCE the task's oracle, not merely report tests-green — the hard
  # version of conductor_service's advisory proof/misfire notes.
  # completion_proof must cite at least one observable token named in the
  # task.oracle (a URL, a :8888/:7778 dev-surface citation, a
  # screenshot/artifact path, or a snake_case metric name).
  require_oracle_citation: true
  # ...and it must address the pre-declared task.likely_misfire: share a
  # meaningful word (>= misfire_word_min_len chars) with the recorded misfire.
  require_misfire_addressed: true
  misfire_word_min_len: 5
