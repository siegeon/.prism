[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-service"
dynamic = ["version"]
description = "PRISM — software engineering methodology + MCP service for AI-assisted development."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "siegeon" }]
keywords = ["claude", "mcp", "knowledge-graph", "ai-assisted-development"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi>=0.115",
  # mcp 2.0.0 (released 2026-07) REMOVED Server.list_tools, which
  # prism_service/mcp/server.py:116 decorates with — an unbounded ">=1.0"
  # let CI install 2.0.0 and every PR went red on a collection error
  # ("'Server' object has no attribute 'list_tools'") that no branch caused.
  # Pin to the 1.x line the code is written against; moving to 2.x is a real
  # migration, not a resolver accident. Dev venv runs 1.27.1.
  "mcp>=1.0,<2",
  "uvicorn[standard]>=0.30",
  "model2vec>=0.3",
  # sqlite-vec is pre-1.0 with storage-format risk: pin to the 0.1.x series
  # the live stores were written with (0.1.9 in the dev venv).
  "sqlite-vec>=0.1.9,<0.2",
  "numpy",
  "tokenizers",
  "threadpoolctl>=3",
  "graphifyy>=0.4.29,<0.5",
  "tree-sitter>=0.21,<1",
  # tree-sitter-languages is unmaintained; tree-sitter-language-pack is the
  # maintained successor with the same get_language/get_parser surface.
  "tree-sitter-language-pack>=1.12",
  "pyyaml>=6",
]

[project.optional-dependencies]
# GH #162 — the neural embedders + CrossEncoder reranker pull torch, which
# ships a 2nd OpenMP runtime (libgomp). Two native-math runtimes in one
# process is threadpoolctl's documented unrecoverable deadlock case, so the
# default model2vec/potion path (numpy-only) must NOT import torch. Install
# this extra only to opt into sentence-transformers embedders / PRISM_RERANK.
neural = [
  "torch>=2.2,<3",
  "sentence-transformers>=2.7",
]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "build>=1.0",
  # test_install_packaging_assets builds the real wheel/sdist via
  # setuptools.build_meta (this package's own build backend); modern
  # 3.12 venvs no longer ship setuptools implicitly, so declare it.
  "setuptools>=68",
]
# OPTIONAL (task 9afd1b72): browser_oracle_runner / evidence_capture use
# Playwright to earn a real UI-oracle receipt and capture screenshots/video.
# Both degrade gracefully (manual_evidence_required / artifact-less receipt)
# when it is not installed, so it stays an opt-in extra, not a hard dep.
browser = [
  "playwright>=1.40",
]

[project.urls]
Homepage = "https://github.com/siegeon/.prism"
Issues = "https://github.com/siegeon/.prism/issues"

[project.scripts]
prism = "prism_service.cli.prism_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["prism_service*"]
exclude = ["tests*", "prism_service.web", "prism_service.web.*"]

[tool.setuptools.dynamic]
version = { attr = "prism_service.__version__.PRISM_VERSION" }

[tool.setuptools.package-data]
"prism_service" = [
  "web_dist/**/*",
  "inference/prompts/*.md",
  "services/*.yaml",
  "assets/*",
  "py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py310"
