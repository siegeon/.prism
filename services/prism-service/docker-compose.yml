services:
  prism-service:
    build: .
    ports:
      - "7778:7778"
      - "7777:7777"
    volumes:
      - ./data:/data
      # v5.2.0 — bind-mount the host's existing Claude Code install.
      # The container's `claude` reads the same OAuth credentials your
      # host's `claude` already has from `claude login`. No setup inside
      # the container, no key juggling. RW so token refresh writes back
      # (8h access tokens rotate via the refresh token in the same file).
      #
      # Override the host path if your claude config lives elsewhere:
      #   PRISM_CLAUDE_HOME=/path/to/.claude docker compose up
      - ${PRISM_CLAUDE_HOME:-${HOME:-${USERPROFILE}}/.claude}:/root/.claude
      # v5.2.0 — bind-mount the parent dir that holds your code. In the
      # SPA's Settings → Projects, point at /code/<repo-name> and PRISM
      # analyzes it where it lives. No clone, no git auth needed in the
      # container (your host already has it).
      - ${PRISM_CODE_DIR:-${HOME:-${USERPROFILE}}/code}:/code:ro
    environment:
      - PRISM_DATA_DIR=/data
      # v5.2.0 — claude reads creds from the bind-mounted host config dir.
      - CLAUDE_CONFIG_DIR=/root/.claude
      # Surfaces the friendly container name in /api/claude-auth/status
      # so the SPA can print `docker exec -it <name> claude /login`
      # instead of the random short ID. Override per install.
      - PRISM_CONTAINER_NAME=${PRISM_CONTAINER_NAME:-prism-service}
      # NiceGUI persists per-client storage under cwd/.nicegui by default.
      # If cwd ever lands on a read-only mount (common when callers bind
      # /project read-only and set working_dir there for `git diff`-style
      # access), every storage-using page silently 500s with an
      # OSError that doesn't surface to the browser. Pin storage to
      # the writable /data volume so the failure mode can't recur.
      # Closes resolve-io/.prism#48.
      - NICEGUI_STORAGE_PATH=/data/.nicegui
      # MiniLM is the +11pt LongMemEval default (vs potion baseline).
      # Override per project if needed: potion | minilm | bge-small | jina-code
      - PRISM_EMBEDDER=${PRISM_EMBEDDER:-minilm}
      # hybrid (default) | vector | bm25 — which search indices contribute
      - PRISM_SEARCH_MODE=${PRISM_SEARCH_MODE:-hybrid}
      # Cross-encoder reranker: off (default) | bge-v2 | jina-v2 | ms-marco-minilm
      - PRISM_RERANK=${PRISM_RERANK:-off}
      - PRISM_RERANK_TOPN=${PRISM_RERANK_TOPN:-50}
      # Contextual chunk prefixing (Anthropic-style): on (default) | off
      - PRISM_CONTEXT_PREFIX=${PRISM_CONTEXT_PREFIX:-on}
      # Feedback consumption weight: per-thumb adjustment to rrf_score.
      # Default 0.002 so ~3 consistent thumbs overcome a typical RRF gap.
      # Set to "off" to disable feedback-driven re-ranking entirely.
      - PRISM_FEEDBACK_WEIGHT=${PRISM_FEEDBACK_WEIGHT:-0.002}
      # Drift auto-reindex interval (seconds). 0 disables the loop.
      - PRISM_DRIFT_INTERVAL=${PRISM_DRIFT_INTERVAL:-1800}
      # Keep torch/HF caches on the mounted volume so bad loads can't brick Docker
      - TORCHINDUCTOR_CACHE_DIR=/data/torch-inductor-cache
      - TORCH_HOME=/data/torch-home
      - HF_HOME=/data/hf-home
    restart: unless-stopped
